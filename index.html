<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#FF6B6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="DailySpend">
<link rel="manifest" href="manifest.json">
<title>DailySpend 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: rgba(255,107,107,0.2); }

:root {
  --coral: #FF6B6B; --peach: #FF8E6E; --amber: #FFB347;
  --mint: #06D6A0;
  --nav-h: 68px;

  /* Light mode tokens */
  --cream: #FFF9F0;
  --warm-white: #FFFAF5;
  --surface: #FFFFFF;
  --surface2: #FFF4EC;
  --border: #f0e8e0;
  --text-dark: #3D2B1F;
  --text-mid: #7A5C4E;
  --text-light: #B8967E;
  --text-dim: #D4B9A8;
  --card-shadow: rgba(255,107,107,0.12);
  --prog-bg: #f0e8e0;
  --stat-coral-bg: linear-gradient(135deg,#FFEDE9,#FFD4CC);
  --stat-coral-c: #8B2500;
  --stat-mint-bg: linear-gradient(135deg,#E3FAF3,#C0F5E2);
  --stat-mint-c: #005A3E;
  --stat-amber-bg: linear-gradient(135deg,#FFF3D9,#FFE5A0);
  --stat-amber-c: #6B3800;
}

html.dark {
    --cream: #1a1118;
    --warm-white: #1f1622;
    --surface: #241b28;
    --surface2: #2a2030;
    --border: #3a2f40;
    --text-dark: #f5eefc;
    --text-mid: #c4a8d8;
    --text-light: #9070a8;
    --text-dim: #5a4468;
    --card-shadow: rgba(0,0,0,0.3);
    --prog-bg: #3a2f40;
    --stat-coral-bg: linear-gradient(135deg,#3d1f2a,#4d2535);
    --stat-coral-c: #ffb3b3;
    --stat-mint-bg: linear-gradient(135deg,#1a3530,#1e403a);
    --stat-mint-c: #80f0cc;
    --stat-amber-bg: linear-gradient(135deg,#3d3010,#4a3a18);
    --stat-amber-c: #ffd080;
}

html { height: 100%; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--cream);
  color: var(--text-dark);
  height: 100%;
  overflow: hidden;
}

/* ── DESKTOP: phone frame in center ── */
@media (min-width: 540px) {
  body {
    background: linear-gradient(135deg, #e8ddd5, #d4c4b8);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  #frame {
    width: 390px;
    height: min(844px, calc(100vh - 48px));
    border-radius: 44px;
    box-shadow: 0 0 0 10px #1a1a1a, 0 0 0 12px #2a2a2a, 0 30px 80px rgba(0,0,0,0.5);
    overflow: hidden;
    position: relative;
    background: var(--cream);
    display: flex;
    flex-direction: column;
  }
  #frame::before {
    content: ''; position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 120px; height: 28px;
    background: #1a1a1a; border-radius: 0 0 18px 18px;
    z-index: 1000; pointer-events: none;
  }
}

/* ── DESKTOP DARK MODE ── */
html.dark body { background: linear-gradient(135deg, #1a1220, #120d18); }

/* ── MOBILE: true fullscreen ── */
@media (max-width: 539px) {
  #frame {
    width: 100%; height: 100vh; height: 100dvh;
    display: flex; flex-direction: column;
    background: var(--cream);
  }
}

/* ── SCROLL AREA (above nav) ── */
#scroll {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  padding-bottom: 12px;
}
#scroll::-webkit-scrollbar { display: none; }

/* ── BOTTOM NAV ── */
#nav {
  flex-shrink: 0;
  height: var(--nav-h);
  background: var(--surface);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: stretch;
  z-index: 50;
}
.nav-btn {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px;
  background: none; border: none; cursor: pointer;
  font-family: 'Nunito', sans-serif; font-size: 11px; font-weight: 700;
  color: var(--text-light); padding: 8px 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.nav-btn.active { color: var(--coral); }
.nav-icon { font-size: 22px; line-height: 1; }

/* ── PAGES ── */
.page { display: none; }
.page.active { display: block; }

/* ── HEADER ── */
.header {
  background: linear-gradient(135deg, #FF6B6B 0%, #FF8E6E 50%, #FFB347 100%);
  padding: 36px 20px 80px; position: relative; overflow: hidden;
}
@media (max-width: 539px) { .header { padding-top: 48px; } }
.hc1 { position: absolute; width: 200px; height: 200px; border-radius: 50%; background: rgba(255,255,255,0.1); top: -60px; right: -40px; pointer-events: none; }
.hc2 { position: absolute; width: 120px; height: 120px; border-radius: 50%; background: rgba(255,255,255,0.08); bottom: 20px; left: -20px; pointer-events: none; }
.header-top { display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 2; }
.app-title { font-family: 'Pacifico', cursive; font-size: 24px; color: white; }
.month-lbl { font-size: 12px; color: rgba(255,255,255,0.85); font-weight: 600; margin-top: 3px; }
.set-budget-btn {
  background: rgba(255,255,255,0.3); border: 2px solid rgba(255,255,255,0.7);
  border-radius: 12px; padding: 8px 14px;
  font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 800;
  color: white; cursor: pointer; position: relative; z-index: 2;
  touch-action: manipulation;
}

/* ── RING ── */
.ring-wrap {
  background: linear-gradient(135deg, #FF6B6B, #FF8E6E, #FFB347);
  padding: 0 0 24px; display: flex; justify-content: center; margin-top: -1px;
}
.ring-container { position: relative; width: 130px; height: 130px; }
.ring-container svg { transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: rgba(255,255,255,0.3); stroke-width: 9; }
.ring-fill { fill: none; stroke: white; stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; }
.ring-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; color: white; }
.ring-pct { font-size: 28px; font-weight: 900; line-height: 1; }
.ring-sub { font-size: 10px; opacity: 0.85; font-weight: 700; }

/* ── BUDGET CARD ── */
.budget-card {
  background: var(--surface); border-radius: 22px;
  margin: -44px 14px 0; padding: 18px;
  box-shadow: 0 4px 20px var(--card-shadow); position: relative; z-index: 3;
}
.budget-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.budget-lbl, .spent-lbl { font-size: 12px; color: var(--text-light); font-weight: 600; }
.budget-amt { font-size: 20px; font-weight: 900; }
.spent-amt { font-size: 17px; font-weight: 800; text-align: right; }
.prog-bar { height: 8px; background: var(--prog-bg); border-radius: 99px; }
.prog-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg,var(--mint),var(--amber)); transition: width 0.8s; }
.prog-fill.warn { background: linear-gradient(90deg,var(--amber),var(--coral)); }
.prog-fill.over { background: linear-gradient(90deg,var(--coral),#c0392b); }
.remain-txt { font-size: 11px; color: var(--text-light); margin-top: 5px; font-weight: 600; }

/* ── ALERT ── */
.alert-box { margin: 10px 14px 0; border-radius: 12px; padding: 12px 14px; font-size: 13px; font-weight: 700; line-height: 1.4; }
.alert-warn { background: linear-gradient(135deg,#FFD166,#FFB347); color: #7A4500; }
.alert-over { background: linear-gradient(135deg,#FF8E6E,#FF6B6B); color: #6B0000; }

/* ── STATS ROW ── */
.stats-row { display: flex; gap: 8px; margin: 12px 14px 0; }
.stat-card { flex: 1; border-radius: 14px; padding: 12px 8px; text-align: center; }
.s-lbl { font-size: 10px; font-weight: 700; opacity: 0.75; margin-bottom: 3px; }
.s-val { font-size: 15px; font-weight: 900; }
.s-coral { background: var(--stat-coral-bg); color: var(--stat-coral-c); }
.s-mint  { background: var(--stat-mint-bg); color: var(--stat-mint-c); }
.s-amber { background: var(--stat-amber-bg); color: var(--stat-amber-c); }

/* ── SECTION TITLE ── */
.sec-title {
  font-size: 15px; font-weight: 800; color: var(--text-dark);
  margin: 18px 14px 8px;
  display: flex; justify-content: space-between; align-items: center;
}
.sec-title span { font-size: 12px; font-weight: 600; color: var(--text-light); cursor: pointer; }

/* ── ADD FORM ── */
.add-card { background: var(--surface); border-radius: 18px; margin: 0 14px 12px; padding: 16px; box-shadow: 0 2px 12px var(--card-shadow); }
.add-row { display: flex; gap: 8px; margin-bottom: 8px; }
.inp {
  flex: 1; border: 2px solid var(--border); border-radius: 11px;
  padding: 10px 12px; font-family: 'Nunito', sans-serif;
  font-size: 14px; font-weight: 600; color: var(--text-dark);
  background: var(--surface2); outline: none;
  touch-action: manipulation;
}
.inp:focus { border-color: var(--coral); }
.inp-amt { width: 100px; flex: none; }
.cat-sel {
  flex: 1; border: 2px solid var(--border); border-radius: 11px;
  padding: 10px 12px; font-family: 'Nunito', sans-serif;
  font-size: 14px; font-weight: 600; color: var(--text-dark);
  background: var(--surface2); outline: none; touch-action: manipulation;
}
.add-btn {
  width: 100%; padding: 12px;
  background: linear-gradient(135deg,var(--coral),var(--peach));
  border: none; border-radius: 13px;
  font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 800;
  color: white; cursor: pointer;
  box-shadow: 0 4px 14px rgba(255,107,107,0.35);
  touch-action: manipulation;
}

/* ── EXPENSE ITEMS ── */
.exp-list { margin: 0 14px; }
.exp-item {
  background: var(--surface); border-radius: 14px; padding: 12px 14px;
  margin-bottom: 8px; display: flex; align-items: center; gap: 10px;
  box-shadow: 0 2px 8px var(--card-shadow);
}
.cat-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.item-info { flex: 1; min-width: 0; }
.item-name { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item-meta { font-size: 11px; color: var(--text-light); font-weight: 600; margin-top: 1px; }
.item-amt { font-size: 14px; font-weight: 900; color: var(--coral); flex-shrink: 0; }
.del-btn { background: none; border: none; font-size: 16px; cursor: pointer; opacity: 0.3; padding: 4px; flex-shrink: 0; touch-action: manipulation; }
.del-btn:hover, .del-btn:active { opacity: 0.8; }
.empty-state { text-align: center; padding: 28px; color: var(--text-light); font-size: 13px; font-weight: 600; }
.empty-icon { font-size: 40px; margin-bottom: 8px; }

/* ── CHARTS ── */
.chart-bar-wrap { margin: 0 14px; }
.chart-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.chart-emoji { font-size: 16px; width: 24px; }
.chart-name { font-size: 12px; font-weight: 700; width: 80px; flex-shrink: 0; }
.chart-bg { flex: 1; background: var(--prog-bg); border-radius: 99px; height: 8px; }
.chart-fill { height: 100%; border-radius: 99px; transition: width 0.6s; }
.chart-amt { font-size: 12px; font-weight: 800; width: 60px; text-align: right; }

/* ── HISTORY ── */
.month-sel { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 12px 14px; }
.m-arrow { background: none; border: 2px solid var(--border); border-radius: 50%; width: 34px; height: 34px; cursor: pointer; font-size: 14px; color: var(--text-mid); touch-action: manipulation; }
.m-lbl { font-size: 15px; font-weight: 800; }

/* ── MODAL ── */
#modal {
  display: none; position: fixed;
  inset: 0; z-index: 9999;
  background: rgba(61,43,31,0.6);
  align-items: flex-end; justify-content: center;
  touch-action: none;
}
#modal.open { display: flex; }
#modal-box {
  background: var(--surface); border-radius: 24px 24px 0 0;
  padding: 24px 20px 40px; width: 100%;
  max-width: 540px;
}
.modal-title {
  font-size: 18px; font-weight: 900; color: var(--text-dark);
  margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center;
}
.modal-close {
  background: var(--surface2); border: none; border-radius: 50%;
  width: 32px; height: 32px; font-size: 15px; cursor: pointer;
  color: var(--text-mid); font-weight: 700; touch-action: manipulation;
}
.form-grp { margin-bottom: 14px; }
.form-lbl { font-size: 12px; font-weight: 700; color: var(--text-mid); margin-bottom: 5px; display: block; }
.form-inp {
  width: 100%; border: 2px solid var(--border); border-radius: 11px;
  padding: 12px 13px; font-family: 'Nunito', sans-serif;
  font-size: 15px; font-weight: 700; color: var(--text-dark);
  background: var(--surface2); outline: none;
}
.form-inp:focus { border-color: var(--coral); }
.save-btn {
  width: 100%; padding: 14px;
  background: linear-gradient(135deg,var(--coral),var(--peach));
  border: none; border-radius: 13px;
  font-family: 'Nunito', sans-serif; font-size: 15px; font-weight: 900;
  color: white; cursor: pointer; margin-top: 6px;
  box-shadow: 0 4px 14px rgba(255,107,107,0.35);
  touch-action: manipulation;
}
.notif-btn {
  width: 100%; padding: 12px; margin-top: 8px;
  background: none; border: 2px solid var(--border); border-radius: 13px;
  font-family: 'Nunito', sans-serif; font-size: 13px; font-weight: 700;
  color: var(--text-mid); cursor: pointer; touch-action: manipulation;
}

/* ── TOAST ── */
.toast {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  background: linear-gradient(135deg,#FF8E6E,#FF6B6B);
  color: white; padding: 10px 18px; border-radius: 14px;
  font-size: 13px; font-weight: 700;
  box-shadow: 0 6px 20px rgba(255,107,107,0.4);
  z-index: 99999; white-space: nowrap; pointer-events: none;
}

/* ── CAT COLORS ── */
.bg-food      { background: linear-gradient(135deg,#FFE5CC,#FFD0A0); }
.bg-transport { background: linear-gradient(135deg,#CCE8FF,#A0D0FF); }
.bg-shop      { background: linear-gradient(135deg,#FFD6E8,#FFB3D0); }
.bg-health    { background: linear-gradient(135deg,#D6F5E8,#A0EACC); }
.bg-entertain { background: linear-gradient(135deg,#EAD6FF,#D0A8FF); }
.bg-bills     { background: linear-gradient(135deg,#FFE8CC,#FFCF99); }
.bg-others    { background: linear-gradient(135deg,#E0E0E0,#C8C8C8); }
.bar-food      { background: linear-gradient(90deg,#FFB347,#FF8E6E); }
.bar-transport { background: linear-gradient(90deg,#118AB2,#06D6A0); }
.bar-shop      { background: linear-gradient(90deg,#FF6B9D,#9B72CF); }
.bar-health    { background: linear-gradient(90deg,#06D6A0,#118AB2); }
.bar-entertain { background: linear-gradient(90deg,#9B72CF,#FF6B9D); }
.bar-bills     { background: linear-gradient(90deg,#FFD166,#FFB347); }
.bar-others    { background: linear-gradient(90deg,#aaa,#888); }

/* ── DARK MODE CAT ICONS ── */
html.dark .bg-food      { background: linear-gradient(135deg,#4a2e10,#5a3a18); }
  .bg-transport { background: linear-gradient(135deg,#102840,#183450); }
  .bg-shop      { background: linear-gradient(135deg,#3a1030,#4a1840); }
  .bg-health    { background: linear-gradient(135deg,#0e3028,#163c32); }
  .bg-entertain { background: linear-gradient(135deg,#281040,#341850); }
  .bg-bills     { background: linear-gradient(135deg,#3a2c10,#4a3818); }
  .bg-others    { background: linear-gradient(135deg,#252525,#303030); }
  .sec-title span { color: var(--text-light); }
  .m-lbl { color: var(--text-dark); }
  .modal-title { color: var(--text-dark); }
  .form-lbl { color: var(--text-mid); }
  .budget-amt, .spent-amt { color: var(--text-dark); }
  .item-name { color: var(--text-dark); }
  .item-amt { color: #ff9090; }
  .ring-pct { color: white; }
  .app-title { color: white; }
}

/* ── IN-APP NOTIFICATION BANNER ── */
#notif-banner {
  position: fixed;
  top: -140px;
  left: 50%;
  transform: translateX(-50%);
  width: calc(100% - 24px);
  max-width: 380px;
  background: white;
  border-radius: 20px;
  padding: 14px 16px;
  box-shadow: 0 12px 40px rgba(0,0,0,0.22), 0 2px 8px rgba(0,0,0,0.1);
  z-index: 9999999;
  display: flex;
  align-items: center;
  gap: 12px;
  transition: top 0.45s cubic-bezier(.34,1.56,.64,1);
  border-top: 4px solid var(--coral);
}
html.dark #notif-banner {
  background: #2a2030;
  box-shadow: 0 12px 40px rgba(0,0,0,0.6);
}
#notif-banner.show { top: 12px; }
#notif-banner .nb-icon { font-size: 26px; flex-shrink: 0; width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
#notif-banner .nb-body { flex: 1; min-width: 0; }
#notif-banner .nb-title { font-size: 14px; font-weight: 800; color: var(--text-dark); margin-bottom: 2px; }
#notif-banner .nb-msg   { font-size: 12px; color: var(--text-mid); font-weight: 600; line-height: 1.4; }
#notif-banner .nb-close { background: #f0e8e0; border: none; border-radius: 50%; width: 26px; height: 26px; font-size: 12px; cursor: pointer; color: var(--text-mid); padding: 0; flex-shrink: 0; touch-action: manipulation; display: flex; align-items: center; justify-content: center; font-weight: 700; }
html.dark #notif-banner .nb-close { background: #3a2f40; color: var(--text-light); }
</style>
</head>
<body>

<!-- MODAL: outside frame, position:fixed always works -->
<div id="modal">
  <div id="modal-box">
    <div class="modal-title">
      Set Monthly Budget
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="form-grp">
      <label class="form-lbl">Currency Symbol</label>
      <input class="form-inp" id="m-currency" placeholder="RM" maxlength="5"/>
    </div>
    <div class="form-grp">
      <label class="form-lbl">Monthly Budget Amount</label>
      <input class="form-inp" id="m-budget" type="number" placeholder="e.g. 2000" min="0"/>
    </div>
    <div class="form-grp">
      <label class="form-lbl">Warn me when I reach (%)</label>
      <input class="form-inp" id="m-threshold" type="number" placeholder="80" min="1" max="99"/>
    </div>
    <button class="save-btn" id="m-save">💾 Save Budget</button>
    <button class="notif-btn" id="m-notif">🔔 Enable Notifications</button>
  </div>
</div>

<!-- APP FRAME -->
<div id="frame">

  <!-- SCROLL AREA -->
  <div id="scroll">

    <!-- HOME PAGE -->
    <div id="pg-home" class="page active">
      <div class="header">
        <div class="hc1"></div><div class="hc2"></div>
        <div class="header-top">
          <div>
            <div class="app-title">DailySpend 🌸</div>
            <div class="month-lbl" id="h-month"></div>
          </div>
          <div style="display:flex;gap:8px;align-items:center;">
            <button id="theme-toggle" style="background:rgba(255,255,255,0.25);border:2px solid rgba(255,255,255,0.5);border-radius:10px;padding:7px 10px;font-size:16px;cursor:pointer;touch-action:manipulation;" title="Toggle dark mode">☀️</button>
            <button class="set-budget-btn" id="open-modal">+ Set Budget</button>
          </div>
        </div>
      </div>

      <div class="ring-wrap">
        <div class="ring-container">
          <svg viewBox="0 0 130 130" width="130" height="130">
            <circle class="ring-bg" cx="65" cy="65" r="55"/>
            <circle class="ring-fill" id="ring-fill" cx="65" cy="65" r="55"
              stroke-dasharray="345" stroke-dashoffset="345"/>
          </svg>
          <div class="ring-center">
            <div class="ring-pct" id="ring-pct">0%</div>
            <div class="ring-sub">used</div>
          </div>
        </div>
      </div>

      <div class="budget-card">
        <div class="budget-row">
          <div><div class="budget-lbl">Monthly Budget</div><div class="budget-amt" id="b-display">RM 0.00</div></div>
          <div><div class="spent-lbl">Spent</div><div class="spent-amt" id="s-display">RM 0.00</div></div>
        </div>
        <div class="prog-bar"><div class="prog-fill" id="prog" style="width:0%"></div></div>
        <div class="remain-txt" id="remain">Tap "+ Set Budget" to get started!</div>
      </div>

      <div id="alert-box" style="display:none;"></div>

      <div class="stats-row">
        <div class="stat-card s-coral"><div class="s-lbl">TODAY</div><div class="s-val" id="st-today">RM 0</div></div>
        <div class="stat-card s-mint"><div class="s-lbl">LEFT</div><div class="s-val" id="st-left">RM 0</div></div>
        <div class="stat-card s-amber"><div class="s-lbl">ITEMS</div><div class="s-val" id="st-count">0</div></div>
      </div>

      <div class="sec-title">Add Expense</div>
      <div class="add-card">
        <div class="add-row">
          <input class="inp" id="inp-name" placeholder="What did you spend on?"/>
          <input class="inp inp-amt" id="inp-amt" type="number" placeholder="Amount" min="0" step="0.01"/>
        </div>
        <div class="add-row">
          <select class="cat-sel" id="inp-cat">
            <option value="food">🍜 Food & Drinks</option>
            <option value="transport">🚗 Transport</option>
            <option value="shop">🛍️ Shopping</option>
            <option value="health">💊 Health</option>
            <option value="entertain">🎮 Entertainment</option>
            <option value="bills">💡 Bills & Utilities</option>
            <option value="others">📦 Others</option>
          </select>
        </div>
        <button class="add-btn" id="add-btn">+ Add Expense</button>
      </div>

      <div class="sec-title">Today's Expenses <span id="see-all">See all →</span></div>
      <div class="exp-list" id="today-list"></div>
    </div><!-- /home -->

    <!-- CHARTS PAGE -->
    <div id="pg-charts" class="page">
      <div class="header" style="padding-bottom:20px;">
        <div class="hc1"></div>
        <div class="app-title" style="font-size:20px;">📊 Breakdown</div>
        <div class="month-lbl" id="chart-month"></div>
      </div>
      <div class="sec-title">By Category</div>
      <div class="chart-bar-wrap" id="chart-cats"></div>
      <div class="sec-title">Daily Spending</div>
      <div style="margin:0 14px 20px;"><canvas id="daily-canvas" height="160"></canvas></div>
    </div>

    <!-- HISTORY PAGE -->
    <div id="pg-history" class="page">
      <div class="header" style="padding-bottom:20px;">
        <div class="hc1"></div>
        <div class="app-title" style="font-size:20px;">📋 History</div>
      </div>
      <div class="month-sel">
        <button class="m-arrow" id="prev-m">←</button>
        <div class="m-lbl" id="hist-month"></div>
        <button class="m-arrow" id="next-m">→</button>
      </div>
      <div class="exp-list" id="hist-list"></div>
    </div>

  </div><!-- /scroll -->

  <!-- BOTTOM NAV — direct child of frame, always at bottom -->
  <div id="nav">
    <button class="nav-btn active" data-pg="home"><span class="nav-icon">🏠</span>Home</button>
    <button class="nav-btn" data-pg="charts"><span class="nav-icon">📊</span>Charts</button>
    <button class="nav-btn" data-pg="history"><span class="nav-icon">📋</span>History</button>
  </div>

</div><!-- /frame -->

<!-- IN-APP NOTIFICATION BANNER -->
<div id="notif-banner">
  <div class="nb-icon" id="nb-icon">🕳️</div>
  <div class="nb-body">
    <div class="nb-title" id="nb-title">Budget Alert</div>
    <div class="nb-msg" id="nb-msg"></div>
  </div>
  <button class="nb-close" onclick="closeBanner()">✕</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
var CAT = {
  food:      {label:'Food & Drinks', emoji:'🍜', bg:'bg-food',      bar:'bar-food'},
  transport: {label:'Transport',     emoji:'🚗', bg:'bg-transport', bar:'bar-transport'},
  shop:      {label:'Shopping',      emoji:'🛍️', bg:'bg-shop',      bar:'bar-shop'},
  health:    {label:'Health',        emoji:'💊', bg:'bg-health',    bar:'bar-health'},
  entertain: {label:'Entertainment', emoji:'🎮', bg:'bg-entertain', bar:'bar-entertain'},
  bills:     {label:'Bills',         emoji:'💡', bg:'bg-bills',     bar:'bar-bills'},
  others:    {label:'Others',        emoji:'📦', bg:'bg-others',    bar:'bar-others'},
};

var ST = {expenses:[], budget:0, currency:'RM', threshold:80};
try {
  var sv = JSON.parse(localStorage.getItem('ds3') || '{}');
  if (sv.expenses)  ST.expenses  = sv.expenses;
  if (sv.budget)    ST.budget    = sv.budget;
  if (sv.currency)  ST.currency  = sv.currency;
  if (sv.threshold) ST.threshold = sv.threshold;
} catch(e) {}

var histM = new Date().getMonth(), histY = new Date().getFullYear();
var dayChart = null, prevPct = 0;

function save() { try { localStorage.setItem('ds3', JSON.stringify(ST)); } catch(e) {} }
function fmt(n) { return ST.currency+' '+parseFloat(n||0).toFixed(2); }
function fmtS(n) { return ST.currency+' '+(n>=1000?(n/1000).toFixed(1)+'k':Math.round(n)); }
function monthName(m,y) { return new Date(y,m,1).toLocaleString('default',{month:'long',year:'numeric'}); }
function getExp(y,m) { return ST.expenses.filter(function(e){ var d=new Date(e.date); return d.getFullYear()===y&&d.getMonth()===m; }); }
function getToday() { var t=new Date().toDateString(); return ST.expenses.filter(function(e){ return new Date(e.date).toDateString()===t; }); }

function toast(msg) {
  var el=document.createElement('div'); el.className='toast'; el.textContent=msg;
  document.body.appendChild(el);
  setTimeout(function(){ el.remove(); }, 2600);
}

// ── MODAL ──
var modal = document.getElementById('modal');

document.getElementById('open-modal').addEventListener('click', function() {
  document.getElementById('m-currency').value  = ST.currency  || 'RM';
  document.getElementById('m-budget').value    = ST.budget    || '';
  document.getElementById('m-threshold').value = ST.threshold || 80;
  modal.classList.add('open');
});

document.getElementById('modal-close').addEventListener('click', function() {
  modal.classList.remove('open');
});

modal.addEventListener('click', function(e) {
  if (e.target === modal) modal.classList.remove('open');
});

document.getElementById('m-save').addEventListener('click', function() {
  var b = parseFloat(document.getElementById('m-budget').value);
  var c = document.getElementById('m-currency').value.trim() || 'RM';
  var t = parseInt(document.getElementById('m-threshold').value) || 80;
  if (isNaN(b) || b <= 0) { toast('Enter a valid budget!'); return; }
  ST.budget = b; ST.currency = c; ST.threshold = Math.min(Math.max(t,1),99);
  save(); modal.classList.remove('open'); render(); toast('Budget saved! 🎉');
  askNotifPermission();
});

document.getElementById('m-notif').addEventListener('click', function() {
  askNotifPermission();
});

// ── NOTIFICATIONS ──
var bannerTimer = null;

function showBanner(icon, title, msg, color) {
  var banner = document.getElementById('notif-banner');
  var iconEl  = document.getElementById('nb-icon');
  iconEl.textContent = icon;
  iconEl.style.background = (color || '#FF6B6B') + '22';
  document.getElementById('nb-title').textContent = title;
  document.getElementById('nb-msg').textContent   = msg;
  banner.style.borderTopColor = color || '#FF6B6B';
  // Force reflow so transition plays fresh
  banner.classList.remove('show');
  void banner.offsetHeight;
  banner.classList.add('show');
  if (bannerTimer) clearTimeout(bannerTimer);
  bannerTimer = setTimeout(closeBanner, 5000);
  if ('vibrate' in navigator) navigator.vibrate([200, 100, 200]);
}

function closeBanner() {
  document.getElementById('notif-banner').classList.remove('show');
}

function askNotifPermission() {
  if (!('Notification' in window)) {
    toast('Using in-app alerts instead 🔔');
    return;
  }
  if (Notification.permission === 'granted') {
    toast('System notifications on! 🔔');
    return;
  }
  if (Notification.permission === 'denied') {
    toast('System notifications blocked — using in-app alerts instead');
    return;
  }
  Notification.requestPermission().then(function(r) {
    if (r === 'granted') toast('System notifications on! 🔔');
    else toast('Using in-app alerts instead 🔔');
  });
}

function sendNotif(title, body, icon, color) {
  // Always show in-app banner (works on ALL devices including Android)
  showBanner(icon || '🕳️', title, body, color);

  // Also try system notification if permission granted (works on iPhone PWA)
  if ('Notification' in window && Notification.permission === 'granted') {
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.ready.then(function(reg) {
          reg.showNotification(title, {
            body: body, tag: 'budget', renotify: true,
            vibrate: [200, 100, 200]
          });
        }).catch(function() {
          try { new Notification(title, {body:body}); } catch(e) {}
        });
      } else {
        new Notification(title, {body:body});
      }
    } catch(e) {}
  }
}

// ── RENDER ──
function render() {
  var now=new Date(), mExp=getExp(now.getFullYear(),now.getMonth()), tExp=getToday();
  var total=0; mExp.forEach(function(e){ total+=e.amount; });
  var todayT=0; tExp.forEach(function(e){ todayT+=e.amount; });
  var pct = ST.budget>0 ? Math.min((total/ST.budget)*100,100) : 0;
  var left = Math.max(ST.budget-total, 0);

  document.getElementById('h-month').textContent  = monthName(now.getMonth(), now.getFullYear());
  document.getElementById('b-display').textContent = fmt(ST.budget);
  document.getElementById('s-display').textContent = fmt(total);
  document.getElementById('s-display').style.color = pct>=100?'#c0392b':pct>=ST.threshold?'#e67e22':'#06D6A0';
  document.getElementById('remain').textContent    = ST.budget>0 ? fmt(left)+' remaining' : 'Tap "+ Set Budget" to get started!';
  document.getElementById('st-today').textContent  = fmtS(todayT);
  document.getElementById('st-left').textContent   = fmtS(left);
  document.getElementById('st-count').textContent  = mExp.length;

  var circ=345, offset=circ-(circ*pct/100);
  var ring=document.getElementById('ring-fill');
  ring.style.strokeDashoffset=offset;
  ring.style.stroke=pct>=100?'#FF4444':pct>=ST.threshold?'#FFD166':'white';
  document.getElementById('ring-pct').textContent=Math.round(pct)+'%';

  var pf=document.getElementById('prog');
  pf.style.width=pct+'%';
  pf.className='prog-fill'+(pct>=100?' over':pct>=ST.threshold?' warn':'');

  var warns=['🕳️ Careful ya! Wallet got hole leh!','😱 Eh eh eh... slow down a bit can?','🛑 ATM is not your friend anymore!','💸 Money going on holiday without you!','🐷 Piggy bank is crying...','🧃 Maybe drink plain water today lah!','👀 Future self is side-eyeing you hard.','🥲 Almost broke lah!'];
  var overs=['💀 Wallet has left the chat. GG.','🚒 Budget on fire! Call finance bomba!','😭 Bank account needs a hug.','🪦 RIP budget '+now.getFullYear()+'. Gone too soon.','🫙 The jar is empty bestie.','🤡 We are so cooked financially.'];
  var ab=document.getElementById('alert-box');
  if (ST.budget>0 && pct>=100) {
    ab.style.display='block'; ab.className='alert-box alert-over';
    ab.innerHTML=overs[Math.floor(total/ST.budget*10)%overs.length]+'<br><small>Overspent by '+fmt(total-ST.budget)+'</small>';
  } else if (ST.budget>0 && pct>=ST.threshold) {
    ab.style.display='block'; ab.className='alert-box alert-warn';
    ab.innerHTML=warns[Math.floor(pct/5)%warns.length]+'<br><small>'+Math.round(pct)+'% of budget used</small>';
  } else { ab.style.display='none'; }

  if (ST.budget>0 && prevPct<ST.threshold && pct>=ST.threshold)
    sendNotif('Eh wallet got hole! 🕳️', 'Spent '+Math.round(pct)+'% of budget. Slow down can? 😅', '🕳️', '#FFB347');
  if (ST.budget>0 && prevPct<100 && pct>=100)
    sendNotif('Budget habis! 💀', 'Used 100% of budget. Wallet has left the chat 🫙', '💀', '#FF6B6B');
  prevPct=pct;

  renderList('today-list', tExp.slice().reverse(), true);
}

function renderList(id, items, isToday) {
  var el=document.getElementById(id);
  if (!items.length) {
    el.innerHTML='<div class="empty-state"><div class="empty-icon">'+(isToday?'🌸':'📭')+'</div>'+(isToday?'No expenses today!':'No expenses this month.')+'</div>';
    return;
  }
  el.innerHTML=items.map(function(e){
    var meta=CAT[e.cat]||CAT.others, d=new Date(e.date);
    var ds=d.toLocaleDateString('en-MY',{day:'numeric',month:'short'})+' '+d.toLocaleTimeString('en-MY',{hour:'2-digit',minute:'2-digit'});
    return '<div class="exp-item">'+
      '<div class="cat-icon '+meta.bg+'">'+meta.emoji+'</div>'+
      '<div class="item-info"><div class="item-name">'+e.name+'</div><div class="item-meta">'+meta.label+' · '+ds+'</div></div>'+
      '<div class="item-amt">'+fmt(e.amount)+'</div>'+
      '<button class="del-btn" onclick="delExp(\''+e.id+'\')">🗑</button>'+
    '</div>';
  }).join('');
}

// ── ADD / DELETE ──
document.getElementById('add-btn').addEventListener('click', function() {
  var name=document.getElementById('inp-name').value.trim()||'Expense';
  var amount=parseFloat(document.getElementById('inp-amt').value);
  var cat=document.getElementById('inp-cat').value;
  if (!amount||amount<=0) { toast('Enter a valid amount!'); return; }
  ST.expenses.push({id:Date.now().toString(), name:name, amount:amount, cat:cat, date:new Date().toISOString()});
  save();
  document.getElementById('inp-name').value='';
  document.getElementById('inp-amt').value='';
  render(); toast('Added! ✨');
});

function delExp(id) {
  if (!confirm('Delete this expense?')) return;
  ST.expenses=ST.expenses.filter(function(e){ return e.id!==id; });
  save(); render(); renderHistory();
}

// ── NAV ──
document.querySelectorAll('.nav-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var pg=this.dataset.pg;
    document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
    document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.remove('active'); });
    document.getElementById('pg-'+pg).classList.add('active');
    this.classList.add('active');
    document.getElementById('scroll').scrollTop=0;
    if (pg==='charts') renderCharts();
    if (pg==='history') renderHistory();
  });
});

document.getElementById('see-all').addEventListener('click', function() {
  document.querySelectorAll('.page').forEach(function(p){ p.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('pg-history').classList.add('active');
  document.querySelector('[data-pg="history"]').classList.add('active');
  renderHistory();
});

// ── CHARTS ──
function renderCharts() {
  var now=new Date(), exp=getExp(now.getFullYear(),now.getMonth());
  document.getElementById('chart-month').textContent=monthName(now.getMonth(),now.getFullYear());
  var cats={};
  exp.forEach(function(e){ cats[e.cat]=(cats[e.cat]||0)+e.amount; });
  var sorted=Object.entries(cats).sort(function(a,b){ return b[1]-a[1]; });
  var maxA=sorted.length?sorted[0][1]:1;
  document.getElementById('chart-cats').innerHTML=sorted.length
    ? sorted.map(function(item){
        var meta=CAT[item[0]]||CAT.others;
        return '<div class="chart-row"><div class="chart-emoji">'+meta.emoji+'</div><div class="chart-name">'+meta.label+'</div><div class="chart-bg"><div class="chart-fill '+meta.bar+'" style="width:'+(item[1]/maxA*100).toFixed(1)+'%"></div></div><div class="chart-amt">'+fmtS(item[1])+'</div></div>';
      }).join('')
    : '<div class="empty-state"><div class="empty-icon">📊</div>No data yet.</div>';

  var days={}, dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate();
  for (var d=1;d<=dim;d++) days[d]=0;
  exp.forEach(function(e){ var d=new Date(e.date).getDate(); days[d]=(days[d]||0)+e.amount; });
  if (dayChart) { dayChart.destroy(); dayChart=null; }
  var cur=ST.currency;
  dayChart=new Chart(document.getElementById('daily-canvas').getContext('2d'),{
    type:'bar',
    data:{labels:Object.keys(days),datasets:[{data:Object.values(days),backgroundColor:Object.keys(days).map(function(d){ return parseInt(d)===now.getDate()?'#FF6B6B':'#FFD166'; }),borderRadius:5,borderSkipped:false}]},
    options:{responsive:true,plugins:{legend:{display:false}},scales:{x:{grid:{display:false},ticks:{font:{family:'Nunito',size:9},color:'#B8967E'}},y:{grid:{color:'#f0e8e0'},ticks:{font:{family:'Nunito',size:9},color:'#B8967E',callback:function(v){ return cur+v; }}}}}
  });
}

// ── HISTORY ──
function renderHistory() {
  document.getElementById('hist-month').textContent=monthName(histM,histY);
  var exp=getExp(histY,histM).slice().sort(function(a,b){ return new Date(b.date)-new Date(a.date); });
  renderList('hist-list',exp,false);
}
document.getElementById('prev-m').addEventListener('click', function(){ histM--; if(histM<0){histM=11;histY--;} renderHistory(); });
document.getElementById('next-m').addEventListener('click', function(){ histM++; if(histM>11){histM=0;histY++;} renderHistory(); });

// ── DARK MODE TOGGLE ──
function applyTheme(dark) {
  if (dark) {
    document.documentElement.classList.add('dark');
    document.getElementById('theme-toggle').textContent = '🌙';
  } else {
    document.documentElement.classList.remove('dark');
    document.getElementById('theme-toggle').textContent = '☀️';
  }
  localStorage.setItem('ds-dark', dark ? '1' : '0');
}

// Load saved theme — default light
var savedTheme = localStorage.getItem('ds-dark');
applyTheme(savedTheme === '1');

document.getElementById('theme-toggle').addEventListener('click', function() {
  var isDark = document.documentElement.classList.contains('dark');
  applyTheme(!isDark);
});

// ── BOOT ──
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
</script>
</body>
</html>
