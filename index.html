<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --coral: #FF6B6B; --peach: #FF8E6E; --amber: #FFB347;
  --mint: #06D6A0; --cream: #FFF9F0; --warm-white: #FFFAF5;
  --text-dark: #3D2B1F; --text-mid: #7A5C4E; --text-light: #B8967E;
}

body {
  font-family: 'Nunito', sans-serif;
  background: var(--cream);
  color: var(--text-dark);
  min-height: 100vh;
  width: 100%;
  padding-bottom: 90px;
  overflow-x: hidden;
}

/* =========================
   ONLY ADD THIS PART BELOW
   (desktop phone view)
========================= */
@media (min-width: 768px) {
  body {
    display: flex;
    justify-content: center;
    background: #f3f3f3;
  }

  /* force phone-like width */
  body > * {
    width: 420px;
    max-width: 420px;
    margin: 0 auto;
  }

  /* fix bottom navigation alignment */
  .bottom-nav {
    width: 420px !important;
    left: 50% !important;
    transform: translateX(-50%) !important;
  }
}

/* ===== YOUR ORIGINAL CSS BELOW (UNCHANGED) ===== */

/* HEADER - NO overflow:hidden so modal is not clipped */
.header {
  background: linear-gradient(135deg, #FF6B6B 0%, #FF8E6E 50%, #FFB347 100%);
  padding: 28px 24px 80px;
  position: relative;
}
.header-circle1 {
  position: absolute; width: 200px; height: 200px;
  border-radius: 50%; background: rgba(255,255,255,0.1);
  top: -60px; right: -40px; pointer-events: none;
}
.header-circle2 {
  position: absolute; width: 120px; height: 120px;
  border-radius: 50%; background: rgba(255,255,255,0.08);
  bottom: 20px; left: -20px; pointer-events: none;
}
.header-top {
  display: flex; justify-content: space-between;
  align-items: center; position: relative; z-index: 1;
}
.app-title { font-family: 'Pacifico', cursive; font-size: 26px; color: white; }
.month-label { font-size: 13px; color: rgba(255,255,255,0.85); font-weight: 600; margin-top: 4px; }

.settings-btn {
  background: rgba(255,255,255,0.3);
  border: 2px solid rgba(255,255,255,0.7);
  border-radius: 14px; padding: 9px 16px;
  font-family: 'Nunito', sans-serif;
  font-size: 14px; font-weight: 800;
  color: white; cursor: pointer;
  position: relative; z-index: 1;
}
.settings-btn:hover { background: rgba(255,255,255,0.45); }

/* RING */
.ring-wrap {
  background: linear-gradient(135deg, #FF6B6B, #FF8E6E, #FFB347);
  padding: 0 0 28px;
  display: flex; justify-content: center;
  margin-top: -1px;
}
.ring-container { position: relative; width: 140px; height: 140px; }
.ring-container svg { transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: rgba(255,255,255,0.3); stroke-width: 10; }
.ring-fill { fill: none; stroke: white; stroke-width: 10; stroke-linecap: round; transition: stroke-dashoffset 0.8s ease; }
.ring-center {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  text-align: center; color: white;
}
.ring-pct { font-size: 30px; font-weight: 900; line-height: 1; }
.ring-sub { font-size: 11px; opacity: 0.85; font-weight: 700; }

/* (YOUR REST OF CSS + HTML + JS REMAINS EXACTLY THE SAME) */

</style>
